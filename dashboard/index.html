<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5e6e8">
  <title>Skytrace | Local Airspace</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./dashboard.css">
  <script type="module" src="./dashboard.js"></script>
</head>
<body>
  <a class="skip-link" href="#airspace-map">Skip to aircraft map</a>
  <header class="topbar">
    <a class="brand-lockup" href="#airspace-map" aria-label="Skytrace home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 2.5 19.5 13l9 5.2-9.1 1.4-2.2 9.9-1.2-5.2-1.2 5.2-2.2-9.9-9.1-1.4 9-5.2L16 2.5Z"/></svg>
      </span>
      <span class="brand-copy"><strong>SKYTRACE <span>1090</span></strong><small>LOCAL ADS-B OBSERVATIONS</small></span>
    </a>
    <div class="receiver-context"><span class="receiver-dot" aria-hidden="true"></span><span>RTL-SDR V4L</span><span class="context-divider" aria-hidden="true"></span><span>RECEIVE ONLY</span></div>
    <div class="header-meta">
      <div id="connection-status" class="connection-status is-waiting" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span><span id="connection-label">WAITING FOR DATA</span>
      </div>
      <div class="updated-block"><span class="meta-label">LAST UPDATE</span><time id="updated-at">N/A</time></div>
    </div>
  </header>

  <main id="workspace" class="workspace">
    <aside id="aircraft-rail" class="aircraft-rail" aria-labelledby="aircraft-heading">
      <div id="aircraft-rail-content" class="rail-content">
        <div class="rail-heading">
          <h1 id="aircraft-heading">Aircraft <span id="aircraft-count" class="count-badge">0</span></h1>
          <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh aircraft data" title="Refresh aircraft data">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.8 9A7.5 7.5 0 0 1 18 6l2 2M4 17v-5h5m10.2 3A7.5 7.5 0 0 1 6 18l-2-2"/></svg>
          </button>
        </div>
        <form class="search-box" id="search-form" role="search">
          <label class="screen-reader-only" for="aircraft-search">Search by callsign or ICAO address</label>
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></svg>
          <input id="aircraft-search" type="search" placeholder="Callsign or ICAO" autocomplete="off" spellcheck="false">
          <button id="clear-search" class="clear-search" type="button" aria-label="Clear aircraft search" title="Clear search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
          <kbd aria-hidden="true">⌘ K</kbd>
        </form>
        <ul id="aircraft-list" class="aircraft-list" aria-label="Detected aircraft" role="list">
          <li class="empty-list">Waiting for aircraft data…</li>
        </ul>
      </div>
      <button id="collapse-rail-button" class="icon-button rail-toggle-button" type="button" aria-label="Collapse aircraft list" title="Collapse aircraft list" aria-expanded="true" aria-controls="aircraft-rail-content">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </aside>

    <section id="airspace-map" class="map-stage" aria-labelledby="map-heading">
      <div id="map" role="application" aria-label="Interactive map of locally received aircraft. Use map controls to zoom and move." tabindex="0"></div>
      <div class="map-topbar">
        <div class="map-title">
          <h2 id="map-heading">Airspace 1090 MHz</h2>
          <span id="position-count" class="map-position-count">0 aircraft positioned</span>
        </div>
        <button id="fit-button" class="map-action" type="button" aria-label="Fit map to all aircraft and observed paths" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></svg>
          <span>Fit traffic</span>
        </button>
      </div>
      <div id="map-message" class="map-message" role="status" aria-live="polite" hidden></div>
    </section>

    <aside id="detail-rail" class="detail-rail" aria-labelledby="details-heading" aria-hidden="true" inert>
      <div class="detail-rail-heading">
        <h2 id="details-heading">Aircraft details</h2>
        <button id="clear-selection" class="close-button" type="button" aria-label="Close aircraft details" title="Close aircraft details" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
      <div id="aircraft-details" class="aircraft-details">
        <div class="detail-placeholder">
          <span class="placeholder-plane" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2.5 19.5 13l9 5.2-9.1 1.4-2.2 9.9-1.2-5.2-1.2 5.2-2.2-9.9-9.1-1.4 9-5.2L16 2.5Z"/></svg></span>
          <p>Select an aircraft to see its received path and decoded details.</p>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
